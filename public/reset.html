<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Membersihkan cache · ANKA</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #0b1b2b;
        --paper: #ffffff;
        --muted: #5e6b78;
        --accent: #3d3b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--ink);
        color: var(--paper);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 440px;
        background: var(--paper);
        color: var(--ink);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 30px 80px -40px rgba(0, 0, 0, 0.6);
      }
      img { width: 190px; height: auto; margin: 0 auto 28px; display: block; }
      h1 { font-size: 1.35rem; letter-spacing: -0.02em; margin: 0 0 10px; }
      p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; margin: 0; }
      .bar {
        height: 3px;
        width: 100%;
        background: #e8e7f2;
        border-radius: 999px;
        overflow: hidden;
        margin: 24px 0 18px;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: var(--accent);
        border-radius: 999px;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        padding: 12px 22px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo-anka.png" alt="ANKA — Aneka Aksesoris" />
      <h1>Membersihkan cache situs…</h1>
      <p>
        Halaman ini menghapus service worker dan cache lama, lalu membuka situs
        versi terbaru secara otomatis.
      </p>
      <div class="bar"><span></span></div>
      <p id="status">Mohon tunggu sebentar.</p>
      <a href="/">Buka situs sekarang</a>
    </div>
    <script>
      (async function () {
        const status = document.getElementById("status");
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if (window.caches) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          status.textContent = "Bersih. Mengalihkan ke situs…";
        } catch (error) {
          status.textContent = "Cache dibersihkan sebagian. Mengalihkan ke situs…";
        }
        window.setTimeout(() => {
          window.location.replace("/");
        }, 700);
      })();
    </script>
  </body>
</html>
